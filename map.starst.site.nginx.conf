server {
    listen 80;
    listen [::]:80;
    server_name map.starst.site;

    location ^~ /.well-known/acme-challenge/ {
        root /home/ubuntu/starmap;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name map.starst.site;

    root /home/ubuntu/starmap;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/map.starst.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/map.starst.site/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location = / {
        try_files /index.html =404;
    }

    location = /index.html {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }

    location = /app.js {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }

    location = /styles.css {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }

    location = /catalog.js {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }

    location / {
        return 404;
    }

    location ~ /\. {
        deny all;
    }
}